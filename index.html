*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Arial,sans-serif}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button,a.button{min-height:48px;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 20px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}button:hover,a.button:hover{border-color:var(--gold)}button:disabled{opacity:.55;cursor:wait}button.primary,a.primary{background:var(--navy);color:white;border-color:var(--navy)}:focus-visible{outline:3px solid var(--gold);outline-offset:3px}header{max-width:1120px;margin:auto;padding:24px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{background:white;border-radius:5px;padding:10px 14px;max-width:290px}.brand img{width:100%;display:block}.header-contact{font-size:13px;color:var(--muted);text-align:right}main{max-width:1060px;margin:15px auto 60px;padding:0 32px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:700;color:var(--muted)}.progress-track{height:5px;background:var(--line);border-radius:8px;overflow:hidden;margin:14px 0}.progress-fill{height:100%;background:var(--gold);transition:width .25s}.steps{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:32px}.steps span.active{color:var(--ink);font-weight:700}.shell{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:38px}.intro{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:24px;margin-bottom:30px}.pose{min-height:120px;border:1px dashed var(--muted);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center;padding:8px}.pose img{width:100%;max-height:170px;object-fit:contain}.bubble{padding:0 0 0 22px;border-left:3px solid var(- margin-top:5px}.metric span{font-size:13px;color:var(--muted)}details{padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:22px 0}summary{min-height:44px;cursor:pointer;font-weight:700}details .grid{margin-top:15px}.gate{background:var(--paper);padding:24px;border-radius:12px;margin-top:24px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{border:1px solid var(--line);padding:22px 18px;border-radius:13px;position:relative}.card.winner{border:2px solid var(--gold)}.card .big{font:normal 29px/1.2 Georgia,serif;margin:12px 0;overflow-wrap:anywhere}.positive{color:var(--green)}.negative{color:var(--red)}.card dl{font-size:13px}.card dt{color:var(--muted);margin-top:12px}.card dd{margin:2px 0 0;font-weight:700}.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:25px 0}.chartbox{border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}.chart-scroll{overflow:auto}.chart-scroll svg{display:block;min-width:380px;width:100%;height:auto}.contact{border-top:1px solid var(--line);margin-top:32px;padding-top:32px}.contact-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.selectable{user-select:text;overflow-wrap:anywhere}.section-space{margin-top:32px}footer{max-width:1060px;margin:0 auto;padding:0 32px 35px;font-size:11px;line-height:1.7;color:var(--muted)}footer a{color:inherit}.copyright{border-top:1px solid var(--line);padding-top:16px;margin-top:20px}.wide{max-width:530px}.foot-note{margin-top:15px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;border:1px solid var(--gold);padding:12px 20px;border-radius:8px;z-index:5;max-width:90%}[hidden]{display:none!important}@media(max-width:700px){header{padding:18px 16px}.brand{max-width:220px}.header-contact{display:none}main{padding:0 16px;margin-top:4px}.shell{padding:23px 18px}.intro{grid-template-columns:65px 1fr;gap:12px;align-items:start}. <form name="debt-calculator-lead" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden><input name="form-name" value="debt-calculator-lead"><input name="bot-field"><input name="name"><input name="phone"><input name="email"><textarea name="home"></textarea><textarea name="debts"></textarea><textarea name="results"></textarea><input name="consent"><input name="rate-source"></form>
<script>
// EDIT HERE: branding, contact information and calculator defaults live in this block.
const CONFIG = {
 name:'Stefanie Gilbert', title:'SVP of Mortgage Lending', nmls:'400390', team:'Sheridan Branch 5231', company:'CrossCountry Mortgage, LLC', companyNmls:'3029',
 address:'954 N Main St, Sheridan, WY 82801', textPhone:'3072187739', callPhone:'3072187739', email:'stefanie.gilbert@ccm.com', tagline:'Welcome Home',
 rateAddon:0.25, defaultCosts:2, headline:'ahead', sampleIndex:6.25, sampleYield:4.25, termMonths:360, horizon:120,
 logo:'logo.png', headshot:'headshot.jpg', poses:['pose-wave.jpg','pose-point-form.jpg','pose-point-down.jpg','pose-point-number.jpg','pose-thumbs-up.jpg'],
 privacyUrl:'https://crosscountrymortgage.com/mortgage/privacy-policy/', ratesEndpoint:'/.netlify/functions/rates', formName:'debt-calculator-lead',
 sampleHomeValue:600000, sampleDebts:[{name:'Home loan',type:'Mortgage',balance:280000,rate:4.25,payment:1733.85,years:20,months:0,revolving:false},{name:'Credit card',type:'Credit card',balance:18000,rate:24.99,payment:540,years:0,months:0,revolving:true},{name:'Auto loan',type:'Auto loan',balance:24000,rate:7.5,payment:746.55,years:3,months:0,revolving:false}]
};
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n), pct=n=>Number(n).toFixed(2)+'%', esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), phone=n=>n.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3'), duration=n=>n===null?'Not paid off at this payment':`${Math.floor(n/12)} yrs ${n%12} mo`, dateLabel=s=>s?new Date(s+'T12:00:00').toLocaleDateString('en-US',{year:'2-digit',month:'2-digit',day:'2-digit'}):'undated';
const state={step:0,name:'',homeValue:CONFIG.sampleHomeValue,property:'Single family',occupancy:'Primary',credit:'760+',debts:structuredClone(CONFIG.sampleDebts).map((d,i)=>({...d,id:i+1,startMode:false,start:''})),nextId:4,index:CONFIG.sampleIndex,costs:CONFIG.defaultCosts,yield:CONFIG.sampleYield,rateInfo:{mortgage:{sample:true,date:null,source:'SAMPLE'},treasury:{sample:true,date:null,source:'SAMPLE'}},unlocked:false,phone:'',email:'',examples:true,dirtyRate:false,dirtyYield:false};
function payment(p,annual,n){const r=annual/1200;return p<=0?0:r===0?p/n:p*r/(1-Math.pow(1+r,-n));}
function remaining(d){if(d.revolving)return null;if(!d.startMode)return Math.round(Number(d.years)*12+Number(d.months));if(!d.start)return null;const [y,m]=d.start.split('-').map(Number),now=new Date();return Math.max(0,Number(d.originalTerm||30)*12-((now.getFullYear()-y)*12+now.getMonth()+1-m));}
function amortMonth(balance,annual,pay){if(balance<.005)return {balance:0,interest:0,paid:0};const interest=balance*annual/1200,paid=Math.min(pay,balance+interest);return {balance:Math.max(0,balance+interest-paid),interest,paid};}
function payoff(balance,rate,pay){if(balance<.005)return 0;if(pay<=balance*rate/1200)return null;let m=0;while(balance>.005&&m<1200){balance=amortMonth(balance,rate,pay).balance;m++;}return m===1200?null:m;}
function calculate(){const ds=state.debts,total=ds.reduce((a,d)=>a+Number(d.balance),0),cost=total*state.costs/100,loan=total+cost,rate=state.index+CONFIG.rateAddon,pay=payment(loan,rate,CONFIG.termMonths),currentPay=ds.reduce((a,d)=>a+Number(d.payment),0),blended=ds.reduce((a,d)=>a+d.balance*d.rate,0)/total;let old=ds.map(d=>Number(d.balance)),oldInterest=0,oldPaid=0,baseBal=loan,baseInterest=0,cum=0,breakeven=cost===0?0:null;const paths=[{name:'Save It',save:1},{name:'Split It',save:.5},{name:'Pay It Down',save:0}].map(s=>({...s,balance:loan,savings:0,interest:0,shortfalls:0,lastExtra:0,lastDiff:0,paidOff:null}));const oldTimeline=[];let baseShortfalls=0,basePaid=0;
for(let m=1;m<=CONFIG.horizon;m++){let oldPayment=0;old=old.map((b,i)=>{const x=amortMonth(b,ds[i].rate,Number(ds[i].payment));oldInterest+=x.interest;oldPayment+=x.paid;return x.balance;});oldPaid+=oldPayment;oldTimeline.push(oldPayment);const b=amortMonth(baseBal,rate,pay);baseBal=b.balance;baseInterest+=b.interest;basePaid+=b.paid;const diff=oldPayment-b.paid;cum+=diff;if(breakeven===null&&cum>=cost)breakeven=m;baseShortfalls+=Math.max(0,-diff);
for(const s of paths){s.savings*=1+state.yield/1200;const regular=amortMonth(s.balance,rate,pay);s.balance=regular.balance;s.interest+=regular.interest;const difference=oldPayment-regular.paid,available=Math.max(0,difference);s.shortfalls+=Math.max(0,-difference);const requested=available*(1-s.save),extra=Math.min(s.balance,requested);s.balance-=extra;s.savings+=available*s.save+(requested-extra);s.lastExtra=extra;s.lastDiff=available;if(s.balance<.005&&s.paidOff===null)s.paidOff=m;}}
const oldBalance=old.reduce((a,b)=>a+b,0);const finish=s=>{s.equity=loan-s.balance;s.interestSaved=oldInterest-s.interest;s.wealth=s.equity+s.interestSaved+s.savings;s.net=s.balance-s.savings;s.ahead=oldBalance-s.net;s.adjustedAhead=s.ahead-s.shortfalls;s.payoff=s.paidOff??(()=>{const months=payoff(s.balance,rate,pay+s.lastExtra);return months===null?null:CONFIG.horizon+months;})();return s;};paths.forEach(finish);const base=finish({name:'Restructure & spend it',balance:baseBal,savings:0,interest:baseInterest,shortfalls:baseShortfalls,lastExtra:0,paidOff:null});const mortgage=ds.find(d=>d.type==='Mortgage');const mortgageTerm=mortgage?remaining(mortgage):null;return {total,cost,loan,rate,pay,currentPay,blended,interestMonth:total*blended/1200,difference:currentPay-pay,ltv:loan/state.homeValue*100,paths,base,oldBalance,oldInterest,oldPaid,cumulative:oldPaid-basePaid,breakeven,mortgageTerm,oldTimeline};}
function field(id,label,value,type='number',attrs=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${attrs}></div>`;}
function intro(title,sub){return `<div class="intro"><div class="pose" data-photo="${CONFIG.poses[state.step]}"></div><div class="bubble"><div class="eyebrow">${esc(CONFIG.name)} · ${esc(CONFIG.tagline)}</div><h1>${title}</h1><p class="sub">${sub}</p></div></div>`;}
function nav(next='Continue'){return `<div id="error" class="error" role="alert"></div><div class="nav">${state.step?'<button id="back">← Back</button>':'<span></span>'}${next?`<button class="primary" id="next">${next} →</button>`:''}</div>`;}
function photos(){document.querySelectorAll('[data-photo]').forEach(el=>{const path=el.dataset.photo;el.textContent=path+' · photo placeholder';const im=new Image();im.alt=CONFIG.name;im.onload=()=>el.replaceChildren(im);im.src=path;});}
function chips(key,label,values){return `<fieldset><legend>${label}</legend><div class="chips">${values.map(v=>`<button data-chip="${key}" data-value="${esc(v)}" aria-pressed="${state[key]===v}">${v}</button>`).join('')}</div></fieldset>`;}
const debtTypes=['Mortgage','HELOC / 2nd','Auto loan','Credit card','Student loan','Personal loan','Other'];
function debtHTML(d,i){return `<article class="debt" data-id="${d.id}"><h3>Debt ${i+1}${state.examples?' · example':''}</h3><div class="grid">${field('d'+d.id+'name','Debt name',d.name,'text','maxlength="80" data-key="name"')}<div class="field"><label for="d${d.id}type">Debt type</label><select id="d${d.id}type" data-key="type">${debtTypes.map(t=>`<option ${t===d.type?'selected':''}>${t}</option>`).join('')}</select></div>${field('d'+d.id+'balance','Balance ($)',d.balance,'number','min="0.01" max="100000000" step="0.01" data-key="balance"')}${field('d'+d.id+'rate','Interest rate (%)',d.rate,'number','min="0" max="100" step="0.01" data-key="rate"')}${field('d'+d.id+'payment','Monthly payment ($)',d.payment,'number','min="0.01" max="1000000" step="0.01" data-key="payment"')}</div>${d.type==='Mortgage'?'<p class="small">Enter principal &amp; interest only.</p>':''}<label class="check"><input type="checkbox" data-key="revolving" ${d.revolving?'checked':''}> Revolving (no set end date)</label>${!d.revolving?`<label class="check"><input type="checkbox" data-key="startMode" ${d.startMode?'checked':''}> Use start date instead</label><div class="grid">${d.startMode?field('d'+d.id+'start','Loan start month',d.start,'month','data-key="start" max="'+new Date().toISOString().slice(0,7)+'"')+field('d'+d.id+'originalTerm','Original term (years)',d.originalTerm||30,'number','min="1" max="50" data-key="originalTerm"'):field('d'+d.id+'years','Years left',d.years||0,'number','min="0" max="50" step="1" data-key="years"')+field('d'+d.id+'months','Months left',d.months||0,'number','min="0" max="11" step="1" data-key="months"')}</div>`:''}<button class="text-button" data-remove="${d.id}">Remove from calculation</button></article>`;}
function rateLine(){const m=state.rateInfo.mortgage;return `${m.sample?'SAMPLE — ':state.dirtyRate?'MANUALLY ADJUSTED — ':''}Rate: Freddie Mac PMMS 30-yr fixed average (${m.date?'week of '+dateLabel(m.date):'sample, no live date'}) ${pct(state.index)} + ${pct(CONFIG.rateAddon)} = ${pct(state.index+CONFIG.rateAddon)}. Restructure rates vary according to your specific terms.${state.dirtyRate?' Index rate was changed by you; it is no longer the published average.':''}`;}
function warnings(r){let a=[];const limit=state.occupancy==='Primary'?(state.property==='2-4 unit'?75:80):state.occupancy==='Investment'&&state.property==='2-4 unit'?70:75;if(r.ltv>limit)a.push(`The estimated loan is ${pct(r.ltv)} of your home value, above the general ${limit}% cash-out guideline used here. This illustration is not an eligibility decision.`);if(state.credit==='Below 620')a.push('Credit below 620 may limit available options. Let’s review your situation.');if(r.difference<=0)a.push('The estimated payment is not lower. There is no initial positive difference to put toward a strategy.');for(const d of state.debts){const months=payoff(d.balance,d.rate,d.payment),term=remaining(d);if(d.payment<=d.balance*d.rate/1200*1.1)a.push(`${d.name}: the payment barely covers interest or does not cover it. The balance may decline very slowly or grow.`);if(months!==null&&months<=CONFIG.horizon)a.push(`${d.name} pays off on its own in about ${duration(months)} at the entered payment. That payment then drops out of the comparison.`);if(!d.revolving&&term!==null&&months!==null&&Math.abs(months-term)>2)a.push(`${d.name}: your payment implies ${duration(months)} to payoff, which differs from your entered ${duration(term)} remaining. The simulation follows the balance, rate and payment; check your statement for a balloon or changed terms.`);}
if(r.mortgageTerm!==null)a.push(`A ${CONFIG.termMonths/12}-year Debt Restructure restarts the clock compared with ${duration(r.mortgageTerm)} left on your current home loan.`);if(r.paths.some(s=>s.shortfalls>.01))a.push(`As current debts pay off, you may need additional cash to cover the Debt Restructure payment. Strategy cards show these cumulative shortfalls and a shortfall-adjusted comparison. No negative difference is invested.`);return a.map(x=>`<p>${esc(x)}</p>`).join('');}
function metric(label,value){return `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`;}
function render(){const screen=$('#screen');$('#progress').setAttribute('aria-valuenow',state.step+1);$('#progress-fill').style.width=(state.step+1)*20+'%';$('#steps').innerHTML=['You','Home','Debts','Numbers','Strategy'].map((t,i)=>`<span class="${i===state.step?'active':''}" ${i===state.step?'aria-current="step"':''}>${i+1}. ${t}</span>`).join('');
if(state.step===0)screen.innerHTML=intro("Let's see what your debt really costs you.",'About two minutes. No credit pull. A clearer picture of your next move.')+`<div class="tag">Know your numbers</div><div class="tag">Explore your options</div><div class="wide section-space">${field('firstName','What’s your first name?',state.name,'text','autocomplete="given-name" maxlength="50" placeholder="Your first name"')}<p class="small">We’ll compare keeping your debts with a Debt Restructure that brings them into one loan secured by your home.</p></div>`+nav('Let’s begin');
if(state.step===1)screen.innerHTML=intro(`Nice to connect with you, ${esc(state.name)}. Tell me about your home.`,'An estimate is a great place to start.')+field('homeValue','Estimated home value ($)',state.homeValue,'number','min="1" max="100000000" step="1000"')+chips('property','Property type',['Single family','Condo','Townhome','2-4 unit'])+chips('occupancy','How do you use this home?',['Primary','Second home','Investment'])+`<div class="field wide"><label for="credit">Estimated credit score</label><select id="credit">${['760+','740–759','720–739','700–719','680–699','660–679','640–659','620–639','Below 620'].map(x=>`<option ${state.credit===x?'selected':''}>${x}</option>`).join('')}</select></div>`+nav();
if(state.step===2)screen.innerHTML=intro(`${esc(state.name)}, let’s put your debts in one place.`,'Use current balances and payments from your statements. Do not include account numbers.')+`<div class="notice"><strong>${state.examples?'Example debts are loaded. Replace them with your own.':'Review all debts before continuing.'}</strong><p class="small">Include your current home loan. Savings assume no new charges and fixed rates and payments. Variable rates and changing minimum payments are not modeled.</p><button id="clearExamples">Clear all debts and start fresh</button><label class="check"><input type="checkbox" id="confirmDebts" ${!state.examples?'checked':''}> These are my figures, or I’m intentionally exploring the examples.</label></div><div id="debtList">${state.debts.map(debtHTML).join('')}</div><button id="addDebt">+ Add a debt</button>`+nav('See my numbers');
if(state.step===3){const r=calculate();screen.innerHTML=intro(`${esc(state.name)}, here’s what your debt costs today.`,'One monthly payment could change your cash flow. Let’s look beyond the first month, too.')+`<div class="metrics">${metric('Blended rate',pct(r.blended))}${metric('Interest this month',money(r.interestMonth))}${metric('Current monthly payments',money(r.currentPay))}</div><div class="hero-number"><span>${r.difference>=0?'Could free up each month':'Estimated monthly payment increase'}</span><strong>${money(Math.abs(r.difference))}</strong><span>Initially · ${money(r.currentPay)} current − ${money(r.pay)} Debt Restructure P&amp;I</span></div><div class="metrics">${metric('Debt Restructure rate',pct(r.rate))}${metric('Restructured loan amount',money(r.loan))}${metric('Percent of home value',pct(r.ltv))}</div><p class="small foot-note">${esc(rateLine())}</p><p class="small">Savings yield: ${state.rateInfo.treasury.sample?'SAMPLE':state.dirtyYield?'MANUALLY ADJUSTED':'10-year Treasury benchmark'} ${pct(state.yield)}${state.rateInfo.treasury.date?' · '+dateLabel(state.rateInfo.treasury.date):''}. A Treasury yield is a benchmark, not a savings-account offer.</p><details><summary>Adjust rate and costs</summary><div class="grid">${field('index','Freddie Mac index rate (%)',state.index,'number','min="0" max="25" step="0.01"')}${field('costs','Restructure costs (%)',state.costs,'number','min="0" max="15" step="0.1"')}${field('yield','Savings yield (%)',state.yield,'number','min="0" max="20" step="0.01"')}</div><button id="recalculate">Update numbers</button></details><div class="notice">${warnings(r)||'<p>Your inputs are ready for a closer look.</p>'}</div><div class="gate"><h2>Unlock the 2nd level strategy.</h2><p>Phone or email is fine. We’ll send your results and never share your info.</p><p class="small">Your results are stored through Netlify. Unlocking sends these details and your calculation to ${esc(CONFIG.name)} at ${esc(CONFIG.company)}. For an email copy, use “Email me a copy” on the next screen; it opens your email app. <a href="${CONFIG.privacyUrl}" target="_blank" rel="noopener">Privacy policy</a></p><div class="grid">${field('leadPhone','Mobile number (optional)',state.phone,'tel','autocomplete="tel" placeholder="307-555-0123"')}${field('leadEmail','Email (optional)',state.email,'email','autocomplete="email" placeholder="you@example.com"')}</div><input name="bot-field" id="botField" hidden tabindex="-1" autocomplete="off"><p class="small">By unlocking, you request a personal follow-up about these results. This is not consent to automated marketing.</p><button id="unlock" class="primary">Unlock my strategies →</button><div id="gateStatus" role="status"></div></div>`+nav(null);}
if(state.step===4)renderStrategy(screen);
bind();photos();}
function drawChart(title,labels,values,higher){const min=Math.min(0,...values),max=Math.max(1,...values),span=max-min,x=v=>155+(v-min)/span*225,zero=x(0);return `<div class="chartbox"><h3>${title}</h3><p class="small">${higher?'Higher is better':'Lower is better'} · all values in dollars</p><div class="chart-scroll"><svg viewBox="0 0 430 ${labels.length*62+35}" role="img" aria-label="${esc(title)}"><title>${esc(labels.map((l,i)=>l+': '+money(values[i])).join('; '))}</title><line x1="${zero}" y1="0" x2="${zero}" y2="${labels.length*62}" stroke="var(--muted)"/>${labels.map((l,i)=>`<text x="0" y="${i*62+21}" fill="var(--ink)" font-size="11">${esc(l)}</text><rect x="${Math.min(zero,x(values[i]))}" y="${i*62+5}" width="${Math.abs(x(values[i])-zero)}" height="22" rx="3" fill="${values[i]<0?'var(--red)':'var(--gold)'}"/><text x="155" y="${i*62+45}" fill="var(--ink)" font-size="11">${money(values[i])}</text>`).join('')}<text x="155" y="${labels.length*62+15}" font-size="10" fill="var(--muted)">Bars share one scale within each chart.</text></svg></div></div>`;}
function renderStrategy(screen){const r=calculate(),headline=CONFIG.headline==='wealth'?'Total wealth unlocked':'Ahead / Behind keeping current debts',winner=Math.max(...r.paths.map(s=>s[CONFIG.headline])),best=r.paths.find(s=>s[CONFIG.headline]===winner);screen.innerHTML=intro(`${esc(state.name)}, give your monthly difference a purpose.`,'Three ways to use only the positive difference as it changes over time.')+`<p class="small">Illustration over ${CONFIG.horizon/12} years · rates and savings yield held constant. Savings are before taxes; home value changes are excluded.</p><div class="cards">${r.paths.map(s=>`<article class="card ${s===best?'winner':''}">${s===best?'<span class="tag">Highest projected '+(CONFIG.headline==='ahead'?'advantage':'wealth')+'</span>':''}<h2>${s.name}</h2><p class="small">${s.save===1?'Save the positive difference each month.':s.save===.5?'Save half. Put half toward extra principal.':'Put the positive difference toward extra principal.'}</p><div class="small">${headline}</div><div class="big ${s[CONFIG.headline]>=0?'positive':'negative'}">${money(s[CONFIG.headline])}</div>${CONFIG.headline==='ahead'?`<p class="small">${s.ahead>=0?'Ahead of':'Behind'} keeping current debts<br>Total wealth unlocked: ${money(s.wealth)}</p>`:`<p class="small">${s.ahead>=0?'Ahead of':'Behind'} keeping current debts: ${money(Math.abs(s.ahead))}</p>`}<dl><dt>Equity paid down</dt><dd>${money(s.equity)}</dd><dt>${s.interestSaved>=0?'Interest saved':'Interest added'} vs. keeping debts</dt><dd>${money(Math.abs(s.interestSaved))}</dd><dt>Savings accumulated</dt><dd>${money(s.savings)}</dd><dt>Net debt after ${CONFIG.horizon/12} years</dt><dd>${money(s.net)}</dd><dt>Loan balance after ${CONFIG.horizon/12} years</dt><dd>${money(s.balance)}</dd><dt>Estimated loan payoff from today</dt><dd>${duration(s.payoff)}</dd><dt>Additional cash needed for payment shortfalls</dt><dd>${money(s.shortfalls)}</dd><dt>Advantage after subtracting those shortfalls</dt><dd class="${s.adjustedAhead>=0?'positive':'negative'}">${money(s.adjustedAhead)}</dd></dl>${s.save<1&&s.payoff!==null&&r.mortgageTerm!==null&&s.payoff<r.mortgageTerm?`<div class="notice positive">Mortgage-free ${duration(r.mortgageTerm-s.payoff)} sooner than your current loan.</div>`:''}</article>`).join('')}</div><div class="notice"><p><strong>Read the headline carefully.</strong> Ahead/Behind = current debts still owed minus the strategy’s loan balance less savings. It does not subtract later payment shortfalls; the adjusted line above does. “Total wealth unlocked” includes paydown that also happens if you keep your debts and is not a measure of the strategy’s true advantage.</p><p class="small">Payoff projections after year ${CONFIG.horizon/12} hold the final month’s extra principal constant. If the loan pays off, unused positive cash goes to savings. Costs are financed and included in the loan balance. Interest saved is shown separately and is not added again to Ahead/Behind.</p></div><h2 class="section-space">Where you stand in ${CONFIG.horizon/12} years</h2><div class="charts">${drawChart('Net debt',['Keep current debts','Restructure & spend it',...r.paths.map(s=>s.name)],[r.oldBalance,r.base.net,...r.paths.map(s=>s.net)],false)}${drawChart(headline,[r.base.name,...r.paths.map(s=>s.name)],[r.base[CONFIG.headline],...r.paths.map(s=>s[CONFIG.headline])],true)}</div><h2>Restructure costs vs. what you keep</h2><div class="metrics">${metric('Estimated restructure costs',money(r.cost))}${metric('Payment difference over 10 years',money(r.cumulative))}${metric('Months to earn back costs',r.breakeven===null?'Not within 120 months':r.breakeven)}${metric('Still owed if nothing changes',money(r.oldBalance))}</div><p class="small">Payment difference uses actual scheduled payments as current debts pay off. Breakeven is the first month the cumulative signed payment difference covers financed restructure costs; it does not guarantee long-term savings.</p><details><summary>What should I know about these figures?</summary>${warnings(r)}<p class="small">${esc(rateLine())}</p></details><section class="contact"><div class="pose" data-photo="${CONFIG.headshot}" style="width:95px;margin-bottom:18px"></div><h2>Curious If This Is the Right Move?</h2><p>${esc(state.name)}, contact me so we can tailor an option for you.</p><div class="contact-buttons"><a class="button primary" id="textLink">Text ${esc(CONFIG.name.split(' ')[0])}</a><a class="button primary" id="emailLink">Email ${esc(CONFIG.name.split(' ')[0])}</a><a class="button primary" href="tel:+1${CONFIG.callPhone}">Call ${esc(CONFIG.name.split(' ')[0])}</a></div><p class="small selectable">Text: ${phone(CONFIG.textPhone)} · Call: ${phone(CONFIG.callPhone)}<br>${esc(CONFIG.email)}</p><h3>Email me a copy of my results</h3><div class="grid">${field('copyEmail','Your email address',state.email,'email','autocomplete="email"')}<div style="align-self:center"><button id="emailCopy">Open email with my results</button></div></div><p class="small">Your email app opens with your results and ${esc(CONFIG.name)} copied. Tap Send to finish. Text and email apps may shorten long messages; use Copy my results if needed.</p><button id="copyResults">Copy my results</button> <button id="printResults">Print results</button><textarea id="copyFallback" aria-label="Results to select and copy" hidden rows="12" style="width:100%;font-size:16px"></textarea><div id="contactStatus" role="status"></div></section>`+nav(null);const body=encodeURIComponent(summary());$('#textLink').href='sms:+1'+CONFIG.textPhone+(/iPhone|iPad|Macintosh/.test(navigator.userAgent)?'&':'?')+'body='+body;$('#emailLink').href='mailto:'+CONFIG.email+'?subject='+encodeURIComponent('Debt Management Calculator: '+state.name)+'&body='+body;}
function summary(){const r=calculate();return `${CONFIG.name} | ${CONFIG.company} | NMLS ${CONFIG.nmls}\nDebt Management Calculator: ${state.name}\nHome: ${money(state.homeValue)}; ${state.property}; ${state.occupancy}; credit ${state.credit}\n${state.examples?'EXAMPLE SCENARIO — not verified client debts\n':''}\nDebts:\n${state.debts.map(d=>`${d.name} (${d.type}): balance ${money(d.balance)}, rate ${pct(d.rate)}, payment ${money(d.payment)}; ${d.revolving?'revolving':duration(remaining(d))+' remaining'}; estimated payoff at payment: ${duration(payoff(d.balance,d.rate,d.payment))}`).join('\n')}\n\nBlended rate: ${pct(r.blended)}; initial monthly interest: ${money(r.interestMonth)}\nCurrent monthly payments: ${money(r.currentPay)}\nDebt Restructure: ${money(r.loan)} at ${pct(r.rate)}, ${money(r.pay)}/month P&I, ${CONFIG.termMonths/12} years; ${pct(r.ltv)} of home value\nInitial monthly difference: ${money(r.difference)}\nEstimated financed restructure costs: ${money(r.cost)} (${pct(state.costs)})\nBreakeven: ${r.breakeven===null?'Not within 120 months':r.breakeven+' months'}\n10-year cumulative signed payment difference: ${money(r.cumulative)}\nSavings yield: ${pct(state.yield)}; ${state.rateInfo.treasury.sample?'SAMPLE':state.dirtyYield?'MANUALLY ADJUSTED':'10-year Treasury'} ${state.rateInfo.treasury.date||'undated'}\n\n${r.paths.map(s=>`${s.name}: ${CONFIG.headline==='ahead'?'Ahead/Behind':'Total wealth unlocked'} ${money(s[CONFIG.headline])}; net debt ${money(s.net)}; ahead/behind ${money(s.ahead)}; total wealth unlocked ${money(s.wealth)}; equity paid down ${money(s.equity)}; ${s.interestSaved>=0?'interest saved':'interest added'} ${money(Math.abs(s.interestSaved))}; savings ${money(s.savings)}; loan balance ${money(s.balance)}; payoff ${duration(s.payoff)}; payment shortfalls ${money(s.shortfalls)}; shortfall-adjusted advantage ${money(s.adjustedAhead)}`).join('\n')}\nRestructure & spend it: net debt ${money(r.base.net)}; ahead/behind ${money(r.base.ahead)}; total wealth unlocked ${money(r.base.wealth)}\nStill owed in 10 years if nothing changes: ${money(r.oldBalance)}\n${rateLine()}\n\n${warnings(r).replace(/<[^>]*>/g,' ').replace(/&amp;/g,'&')}\nEstimates only. Taxes, insurance, mortgage insurance and HOA extra. Savings before taxes, yields not guaranteed. Debt Restructure is secured by your home.\n\nCan we look at my real options?`;}
function fail(s){$('#error').textContent=s;}
function validDebts(){if(!state.debts.length)return 'Add at least one debt.';for(const d of state.debts){if(!d.name.trim()||!Number.isFinite(Number(d.balance))||d.balance<=0||d.balance>1e8||!Number.isFinite(Number(d.rate))||d.rate<0||d.rate>100||!Number.isFinite(Number(d.payment))||d.payment<=0||d.payment>1e6)return 'Check every debt: enter a name, positive balance and payment, and a rate from 0% to 100%.';if(d.startMode&&!d.revolving&&(!d.start||d.start>new Date().toISOString().slice(0,7)||!Number.isInteger(Number(d.originalTerm||30))||Number(d.originalTerm||30)<1||Number(d.originalTerm||30)>50))return 'Check the start month and original term.';if(!d.revolving&&(remaining(d)===null||remaining(d)<=0||Number(d.months)>11||Number(d.months)<0||!Number.isInteger(Number(d.years))||!Number.isInteger(Number(d.months))))return 'Enter a valid remaining term, or a past start month and original term.';}return '';}
function validEmail(s){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)&&s.length<=254;}
function validPhone(s){return /^(1?\d{10})$/.test(s.replace(/\D/g,''));}
function go(step){state.step=step;render();window.scrollTo({top:0,behavior:'smooth'});$('#screen h1').setAttribute('tabindex','-1');$('#screen h1').focus({preventScroll:true});}
function bind(){if($('#back'))$('#back').onclick=()=>go(state.step-1);if($('#next'))$('#next').onclick=()=>{if(state.step===0){state.name=$('#firstName').value.trim();if(!state.name)return fail('Enter your first name to continue.');}if(state.step===1){state.homeValue=Number($('#homeValue').value);state.credit=$('#credit').value;if(state.homeValue<=0||state.homeValue>1e8||!Number.isFinite(state.homeValue))return fail('Enter a home value greater than zero.');}if(state.step===2){const e=validDebts();if(e)return fail(e);if(!$('#confirmDebts').checked)return fail('Confirm you reviewed the example debts before continuing.');}go(state.step+1);};document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{if($('#homeValue'))state.homeValue=Number($('#homeValue').value);if($('#credit'))state.credit=$('#credit').value;state[b.dataset.chip]=b.dataset.value;render();});if($('#firstName'))$('#firstName').onkeydown=e=>{if(e.key==='Enter')$('#next').click();};if($('#addDebt'))$('#addDebt').onclick=()=>{state.debts.push({id:state.nextId++,name:'',type:'Credit card',balance:'',rate:'',payment:'',years:0,months:0,revolving:true,startMode:false,start:''});render();};if($('#clearExamples'))$('#clearExamples').onclick=()=>{state.debts=[];state.examples=false;render();};document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.debts=state.debts.filter(d=>d.id!==Number(b.dataset.remove));render();});document.querySelectorAll('.debt input,.debt select').forEach(el=>{el.oninput=()=>{const d=state.debts.find(d=>d.id===Number(el.closest('[data-id]').dataset.id)),key=el.dataset.key;d[key]=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?'':Number(el.value)):el.value;if(['type','revolving','startMode'].includes(key)){if(key==='type')d.revolving=['Credit card','HELOC / 2nd'].includes(d.type);render();}};});if($('#recalculate'))$('#recalculate').onclick=()=>{const i=Number($('#index').value),c=Number($('#costs').value),y=Number($('#yield').value);if(![$('#index'),$('#costs'),$('#yield')].every(el=>el.value!==''&&el.checkValidity()))return fail('Use valid, non-negative rates and costs within the displayed limits.');state.dirtyRate=state.dirtyRate||i!==state.index;state.dirtyYield=state.dirtyYield||y!==state.yield;state.index=i;state.costs=c;state.yield=y;state.phone=$('#leadPhone').value;state.email=$('#leadEmail').value;render();};if($('#unlock'))$('#unlock').onclick=unlock;if($('#copyResults'))$('#copyResults').onclick=async()=>{try{await navigator.clipboard.writeText(summary());$('#contactStatus').textContent='Results copied. Paste them into your text or email.';}catch{const el=$('#copyFallback');el.hidden=false;el.value=summary();el.focus();el.select();$('#contactStatus').textContent='Select and copy these results.';}};if($('#printResults'))$('#printResults').onclick=()=>window.print();if($('#emailCopy'))$('#emailCopy').onclick=()=>{const email=$('#copyEmail').value.trim();if(!validEmail(email))return $('#contactStatus').textContent='Enter a valid email address.';window.location.href='mailto:'+encodeURIComponent(email)+'?cc='+encodeURIComponent(CONFIG.email)+'&subject='+encodeURIComponent('Debt Management Calculator: '+state.name)+'&body='+encodeURIComponent(summary());};}
async function unlock(){const button=$('#unlock'),status=$('#gateStatus');state.phone=$('#leadPhone').value.trim();state.email=$('#leadEmail').value.trim();if((!state.phone&&!state.email)||(state.phone&&!validPhone(state.phone))||(state.email&&!validEmail(state.email))){status.textContent='Enter a valid mobile number or email. If you entered both, check both.';return;}button.disabled=true;status.textContent='Sending your results securely…';const payload=new URLSearchParams({'form-name':CONFIG.formName,'bot-field':$('#botField').value,name:state.name,phone:state.phone.replace(/\D/g,''),email:state.email,home:JSON.stringify({value:state.homeValue,property:state.property,occupancy:state.occupancy,credit:state.credit}),debts:JSON.stringify(state.debts),results:summary(),consent:'Requested personal follow-up about calculator results; no automated marketing consent.','rate-source':rateLine()});try{const res=await fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:payload.toString(),signal:AbortSignal.timeout(20000)});if(!res.ok)throw Error('submission');state.unlocked=true;go(4);}catch{button.disabled=false;status.textContent='Your results could not be sent. Please try again, or contact '+CONFIG.name+' at '+phone(CONFIG.textPhone)+'. If viewing a downloaded copy, deploy it to Netlify first.';}}
async function loadRates(){try{const res=await fetch(CONFIG.ratesEndpoint,{signal:AbortSignal.timeout(20000)});if(!res.ok)throw Error();const data=await res.json();for(const key of ['mortgage','treasury']){const d=data[key];if(!d||!Number.isFinite(d.value)||d.value<0||!d.date)throw Error();}state.rateInfo=data;if(!state.dirtyRate)state.index=data.mortgage.value;if(!state.dirtyYield)state.yield=data.treasury.value;if(state.step===3){state.phone=$('#leadPhone').value;state.email=$('#leadEmail').value;}if(state.step===3||state.step===4)render();}catch{/* Editable sample rates remain clearly labeled. */}}
$('#brand').innerHTML=`<img src="${CONFIG.logo}" alt="${esc(CONFIG.company)} · ${esc(CONFIG.name)}">`;$('#header-contact').innerHTML=`${esc(CONFIG.name)} · NMLS ${CONFIG.nmls}<br>${esc(CONFIG.title)} · ${phone(CONFIG.callPhone)}`;$('.eyebrow').textContent='Debt management calculator · '+CONFIG.tagline;
$('#footer').innerHTML=`<p>For informational purposes only. This is an illustration, not a loan offer, rate quote, commitment to lend or rate lock. Results are estimates from the figures entered. The rate is the Freddie Mac PMMS 30-year average plus ${pct(CONFIG.rateAddon)} and is not an offer. Restructure rates vary according to your specific terms. Principal and interest only; no taxes, insurance, mortgage insurance or HOA. Restructure costs are estimates. “Total wealth unlocked” adds estimated equity paid down, interest saved and savings, and is not a guarantee of future value. Terms, options and credit availability depend on credit, income, property, program, underwriting approval and market conditions. Not all applicants will qualify. Savings and Treasury yields vary and aren’t guaranteed. Restructuring debt into a mortgage may increase total finance charges over the life of the loan. Unsecured debt becomes debt secured by your home; failure to pay can put your home at risk. Consult a tax or financial advisor.</p><p class="copyright">${esc(CONFIG.name)}, ${esc(CONFIG.title)} · NMLS ${CONFIG.nmls}<br>${esc(CONFIG.team)} · ${esc(CONFIG.company)} · Company NMLS ${CONFIG.companyNmls}<br>${esc(CONFIG.address)}<br>Equal Housing Opportunity · <a href="https://www.nmlsconsumeraccess.org" target="_blank" rel="noopener">NMLS Consumer Access</a> · <a href="${CONFIG.privacyUrl}">Privacy policy</a></p>`;
$('#theme').onclick=()=>{const dark=window.matchMedia('(prefers-color-scheme: dark)').matches,current=document.documentElement.dataset.theme||(dark?'dark':'light');document.documentElement.dataset.theme=current==='dark'?'light':'dark';};render();loadRates();
